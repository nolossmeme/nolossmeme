name: Bug
description: Something does not behave as documented
labels: ["type: bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
  - type: textarea
    id: actual
    attributes:
      label: Actual
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: testnet / sandbox, contract account, commit
