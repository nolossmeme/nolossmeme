name: Feature
description: A new capability or improvement
labels: ["type: feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Checklist of concrete deliverables
      value: "- [ ] "
  - type: textarea
    id: notes
    attributes:
      label: Notes and constraints
