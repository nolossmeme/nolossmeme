name: deploy-vps

on:
  push:
    branches: [main]
    paths:
      ["apps/**", "packages/**", "services/**", "deploy/vps/**", ".github/workflows/deploy-vps.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.VPS_HOST != '' }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Pull and rebuild on the VPS
        env:
          HOST: ${{ vars.VPS_HOST }}
          USER: ${{ vars.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            'cd ~/apps/nolossmeme && git pull --ff-only && docker compose -f deploy/vps/compose.yml --env-file deploy/vps/.env up -d --build --remove-orphans && docker image prune -f >/dev/null'
