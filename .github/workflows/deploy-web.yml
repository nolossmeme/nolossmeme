name: deploy-web

on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nolossmeme/sdk build
      - name: Build landing (site root)
        run: pnpm --filter @nolossmeme/landing build
        env:
          VITE_BASE: /nolossmeme/
          VITE_APP_URL: /nolossmeme/app/
      - name: Build dApp (under /app)
        run: pnpm --filter @nolossmeme/web build
        env:
          VITE_BASE: /nolossmeme/app/
          VITE_LANDING_URL: /nolossmeme/
      - name: Assemble one Pages artifact
        run: |
          mkdir -p site
          cp -R apps/landing/dist/. site/
          mkdir -p site/app
          cp -R apps/web/dist/. site/app/
          rm -f site/app/404.html
      - uses: actions/upload-pages-artifact@v7
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
