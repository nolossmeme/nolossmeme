<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages serves this for deep links. The dApp lives under /app; stash the path and
      // send the browser to the right entry point.
      var path = location.pathname;
      var root = path.indexOf("/nolossmeme/") === 0 ? "/nolossmeme/" : "/";
      var app = root + "app/";
      if (path.indexOf(app) === 0) {
        sessionStorage.setItem("nlm:path", path + location.search);
        location.replace(app);
      } else {
        location.replace(root);
      }
    </script>
  </head>
  <body></body>
</html>
