<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Static hosts serve this for deep links; stash the path and go to the app root.
      var m =
        location.pathname.match(/^(\/[^/]+)?\/app\//) || location.pathname.match(/^\/nolossmeme\//);
      var base = m ? m[0] : "/";
      sessionStorage.setItem("nlm:path", location.pathname + location.search);
      location.replace(base);
    </script>
  </head>
  <body></body>
</html>
