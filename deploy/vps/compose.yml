# docker compose -f deploy/vps/compose.yml --env-file deploy/vps/.env up -d --build
# Host nginx terminates TLS: nolossmeme.fun -> 127.0.0.1:3181 (landing), app.nolossmeme.fun -> 3183 (dApp),
# api.nolossmeme.fun -> 3182 (backend).
name: nolossmeme

services:
  landing:
    build:
      context: ../..
      dockerfile: deploy/vps/site/Dockerfile
      target: landing
      args: &site-args
        VITE_INDEXER_URL: ${VITE_INDEXER_URL:-https://api.nolossmeme.fun}
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        VITE_APP_URL: https://app.nolossmeme.fun/
        VITE_LANDING_URL: https://nolossmeme.fun/
    image: nolossmeme-landing:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3181:80"

  app:
    build:
      context: ../..
      dockerfile: deploy/vps/site/Dockerfile
      target: app
      args: *site-args
    image: nolossmeme-app:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3183:80"

  backend:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
    image: nolossmeme-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3182:8787"
    volumes:
      - backend-data:/data
    environment:
      NEAR_NETWORK: testnet
      DATABASE_URL: file:/data/nolossmeme.db
      PORT: "8787"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.nolossmeme.fun,https://nolossmeme.fun}
      LOG_LEVEL: info
      KEEPER_ACCOUNT_ID: ${KEEPER_ACCOUNT_ID:-}
      KEEPER_PRIVATE_KEY: ${KEEPER_PRIVATE_KEY:-}
      FAUCET_ACCOUNT_ID: ${FAUCET_ACCOUNT_ID:-}
      FAUCET_PRIVATE_KEY: ${FAUCET_PRIVATE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SPONSOR_ACCOUNT_ID: ${SPONSOR_ACCOUNT_ID:-}
      SPONSOR_PRIVATE_KEY: ${SPONSOR_PRIVATE_KEY:-}
      SPONSOR_AMOUNT_NEAR: ${SPONSOR_AMOUNT_NEAR:-1}
      SPONSOR_INTERVAL_HOURS: ${SPONSOR_INTERVAL_HOURS:-12}
      FACTORY_ID: ${FACTORY_ID:-}
      START_BLOCK: ${START_BLOCK:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend-data:
