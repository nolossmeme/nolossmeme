server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed assets are immutable; HTML is not.
    location ~* \.(js|css|woff2?|png|svg|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # dApp: client-side routes fall back to its index.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
    location /app {
        return 301 /app/;
    }
    # Landing is a single page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
