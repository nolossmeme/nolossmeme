# One single-page app per container: hashed assets are immutable, every other path falls back to index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* \.(js|css|woff2?|png|svg|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
