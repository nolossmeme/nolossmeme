[project]
name = "nolossmeme-sim"
version = "0.1.0"
description = "60-day tokenomics simulation for NoLossMeme pools"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.9"]

[project.scripts]
nolossmeme-sim = "nolossmeme_sim.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
